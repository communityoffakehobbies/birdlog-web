# A fixture for the security sweep: it runs only by hand, and its weak spots
# (tag-pinned actions, no permissions block) are there on purpose to be hardened.
name: checks
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test --if-present
